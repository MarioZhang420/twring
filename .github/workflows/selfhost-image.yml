# Publishes the self-hosting server image ghcr.io/saasagelabs/twring:<version> for linux/amd64 and
# linux/arm64 from main, with the repository's own token: no personal GHCR token, no Linux box.
# The run records the digest in apps/site/selfhost/versions.json and uploads that file: commit it
# through a PR, then deploy the site (scripts/deploy-site.sh). scripts/publish-image.sh is the same
# release by hand.
name: 'Self-host image: publish'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.0.5 (a version is never reused)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: selfhost-image
  cancel-in-progress: false

jobs:
  publish:
    # A published version is always a commit on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/saasagelabs/twring
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo '::error::The version must be major.minor.patch, for example 1.0.5.'
            exit 1
          fi
          node deploy/selfhost/versions.ts check apps/site/selfhost/versions.json "$VERSION"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse a version already published
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published. Pick a new version."
            exit 1
          fi
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: TWRING_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/saasagelabs/twring
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
      - name: Record the digest in versions.json
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo '::error::The build did not report the image digest.'
            exit 1
          fi
          node deploy/selfhost/versions.ts record apps/site/selfhost/versions.json "$VERSION" "$DIGEST"
          {
            echo "Published \`$IMAGE:$VERSION\` as \`$DIGEST\` from $GITHUB_SHA."
            echo
            echo 'Next: commit the uploaded versions.json through a PR, then deploy the site.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: versions-json-${{ env.VERSION }}
          path: apps/site/selfhost/versions.json
